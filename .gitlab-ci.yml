# .gitlab-ci.yml — GB300 GPU CI pipeline for trt-transformers
#
# Fat image (trtf-dev-gb300:latest) has all Python deps baked in at /opt/venv.
# ENV PATH includes /opt/venv/bin, so python/pip/pytest work without activation.
# ENV vars TRT_LIB_DIR, TRT_INC_DIR, LD_LIBRARY_PATH are pre-set.
#
# Test impact analysis (tools/test_impact.py) drives selective execution:
#   - Only affected E2E models run (based on git diff vs target branch)
#   - Unit test tiers run only when relevant source files change
#   - Safety invariant: unknown files trigger ALL tests (zero false negatives)

stages:
  - analyze
  - build
  - tier1-unit
  - tier2-graph-ops
  - tier3-e2e
  - nightly-e2e
  - nightly-coverage

variables:
  ENGINE_DIR: /workspace/users/yifeif/trt-transformers/engines
  GIT_STRATEGY: fetch
  PYTHONHASHSEED: "0"
  # Coverage gates: set to current measured levels as floor (measured 2026-03-12).
  # Ratchet up as coverage improves. See docs/wiki/ISO-26262-Compliance.md §4.
  #
  # Measured 2026-03-12 (unit tests only, no GPU/TRT tests):
  #   C++:    lines 40.1%, functions 54.3%, branches 23.4%
  #   Python: lines 41.4% (builder unit), branches ~30%
  #
  # Thresholds set 2-5% below measured to avoid false failures from
  # minor fluctuation while still catching real regressions.
  PYTHON_COVERAGE_MIN_LINE: "38"
  PYTHON_COVERAGE_MIN_BRANCH: "25"
  CPP_COVERAGE_MIN_LINE: "36"
  CPP_COVERAGE_MIN_FUNCTION: "46"
  CPP_COVERAGE_MIN_BRANCH: "21"

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: trtf-dev-gb300:latest
  tags: [gpu-gb300]
  interruptible: true
  before_script:
    - python -c "import transformers, sys; print(f'python={sys.executable} transformers={transformers.__version__}'); assert transformers.__version__ == '5.2.0', transformers.__version__"
    - pip install --no-deps -e trtf_build/
    - chmod +x ./build/trtf 2>/dev/null || true

# ── Analyze: Test Impact Analysis (fast, no GPU) ────────────────────────────

impact-analysis:
  stage: analyze
  before_script: []   # No deps needed — pure Python + git
  script:
    - python3 tools/test_impact.py --validate
    # Try to fetch coverage map for per-test selection (non-fatal if unavailable)
    - |
      python3 tools/coverage_map/fetch_latest.py \
        --output coverage_map.json \
        --local-fallback "${COVERAGE_MAP_PATH:-}" \
        || echo "No coverage map available -- using tier-level selection"
    # Run impact analysis with coverage map if available
    - |
      if [ -f coverage_map.json ]; then
        python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --coverage-map coverage_map.json --json > impact.json
      else
        python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --json > impact.json
      fi
    - echo "--- Impact Analysis ---"
    - cat impact.json
    - python3 tools/test_impact.py --base ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --verbose
  artifacts:
    paths:
      - impact.json
      - coverage_map.json
    expire_in: 1 day
  timeout: 5m

# ── Build ──────────────────────────────────────────────────────────────────────

build-all:
  stage: build
  script:
    - |
      cmake -S . -B build -G Ninja \
        -DTRTF_TRT_INCLUDE_DIR=$TRT_INC_DIR \
        -DTRTF_TRT_LIBRARY=$TRT_LIB_DIR/libnvinfer.so \
        -DTRTF_CUDA_INCLUDE_DIR=/usr/local/cuda/include \
        -DTRTF_CUDART_LIBRARY=/usr/local/cuda/lib64/libcudart.so
    - cmake --build build -j
  artifacts:
    paths:
      - build/
    expire_in: 1 day
  timeout: 15m

# ── Tier 1: Unit Tests + Static Gates ────────────────────────────────────────
# Unit test jobs skip when their tier is not affected (per impact.json).
# Coverage and static checks always run (cheap, important for tracking).

check-family-coverage:
  stage: tier1-unit
  needs: [build-all]
  script:
    - python scripts/check_family_coverage.py
  timeout: 15m

check-cyclomatic-complexity:
  stage: tier1-unit
  needs: [build-all]
  script:
    - lizard --version
    - python tools/check_cyclomatic_complexity.py src --max-ccn ${CCM_MAX_CCN:-10} --top 20
  timeout: 15m

lint-check:
  stage: tier1-unit
  needs: [build-all]
  script:
    - pip install --quiet ruff
    # Only lint files changed in this MR (codebase has pre-existing violations)
    - |
      CHANGED_PY=$(git diff --name-only ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} -- '*.py' || true)
      if [ -n "$CHANGED_PY" ]; then
        echo "Checking Python lint on changed files:"
        echo "$CHANGED_PY"
        echo "$CHANGED_PY" | xargs ruff check --config ruff.toml
      fi
    - |
      CHANGED_CPP=$(git diff --name-only ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} -- '*.cpp' '*.h' || true)
      if [ -n "$CHANGED_CPP" ]; then
        echo "Checking C++ formatting on changed files:"
        echo "$CHANGED_CPP" | xargs clang-format --dry-run --Werror
      fi
  timeout: 5m

test-tools:
  stage: tier1-unit
  needs: [build-all, impact-analysis]
  script:
    - |
      if ! python3 -c "import json; d=json.load(open('impact.json')); exit(0 if 'tools' in d['unit_tiers'] else 1)"; then
        echo "Skipping: tools tier not affected by this change"
        exit 0
      fi
    - python -m pytest tests/tools/ -v -n auto
  timeout: 20m

test-cpp-unit:
  stage: tier1-unit
  needs: [build-all, impact-analysis]
  script:
    - |
      if ! python3 -c "import json; d=json.load(open('impact.json')); exit(0 if 'cpp' in d['unit_tiers'] else 1)"; then
        echo "Skipping: cpp tier not affected by this change"
        exit 0
      fi
    - |
      # Check for coverage-map-based selective tests
      CPP_TESTS=$(python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      tests = d.get('cpp_tests', [])
      fallback = d.get('fallback_tiers', [])
      if 'cpp' in fallback or not tests:
          sys.exit(0)
      print('|'.join(tests))
      " 2>/dev/null) || true
      if [ -n "$CPP_TESTS" ]; then
        echo "Selective C++ tests: $CPP_TESTS"
        ctest --test-dir build -R "$CPP_TESTS" --output-on-failure
      else
        echo "Running all C++ tests (fallback or no coverage map)"
        ctest --test-dir build --output-on-failure
      fi
  timeout: 20m

test-python-builder:
  stage: tier1-unit
  needs: [build-all, impact-analysis]
  script:
    - |
      if ! python3 -c "import json; d=json.load(open('impact.json')); exit(0 if 'builder' in d['unit_tiers'] else 1)"; then
        echo "Skipping: builder tier not affected by this change"
        exit 0
      fi
    - |
      # Check for coverage-map-based selective tests
      BUILDER_TESTS=$(python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      tests = d.get('builder_tests', [])
      fallback = d.get('fallback_tiers', [])
      if 'builder' in fallback or not tests:
          sys.exit(0)
      print(' or '.join(tests))
      " 2>/dev/null) || true
      if [ -n "$BUILDER_TESTS" ]; then
        echo "Selective builder tests: $BUILDER_TESTS"
        python -m pytest tests/builder/ -v --ignore=tests/builder/test_cli.py -k "$BUILDER_TESTS" -n auto
      else
        echo "Running all builder tests (fallback or no coverage map)"
        python -m pytest tests/builder/ -v --ignore=tests/builder/test_cli.py -n auto
      fi
  timeout: 40m

coverage-python:
  stage: tier1-unit
  needs:
    - job: build-all
      artifacts: false
  script:
    - python -m pip install --disable-pip-version-check --quiet "coverage[toml]==7.6.10"
    - bash tools/coverage_ci/run_python_coverage.sh
  coverage: '/PYTHON_COVERAGE_LINE=([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/python-cobertura.xml
    paths:
      - coverage/python-coverage.txt
      - coverage/python-cobertura.xml
    expire_in: 2 days
  timeout: 30m

coverage-cpp:
  stage: tier1-unit
  needs:
    - job: build-all
      artifacts: false
  script:
    - python -m pip install --disable-pip-version-check --quiet "gcovr==8.2"
    - bash tools/coverage_ci/run_cpp_coverage.sh
  coverage: '/CPP_COVERAGE_LINE=([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cpp-cobertura.xml
    paths:
      - coverage/cpp-coverage-summary.txt
      - coverage/cpp-cobertura.xml
    expire_in: 2 days
  timeout: 40m

# ── Tier 2: Graph-Op GPU Tests (~3 min) ──────────────────────────────────────

test-graph-ops:
  stage: tier2-graph-ops
  needs: [test-python-builder, test-cpp-unit, coverage-python, coverage-cpp]
  script:
    - nvidia-smi
    - python -m pytest tests/builder/test_graph_ops.py tests/builder/test_graph_ops_extended.py tests/builder/test_graph_blocks.py -v -n auto
  timeout: 20m

# ── Tier 3: Selective E2E Tests (impact-driven) ─────────────────────────────
# Replaces the old tier3-smoke + tier4-full-e2e pipeline.
# Runs ONLY the E2E models affected by this MR's changes.
# - Family plugin change: tests only that family's models (~5 min)
# - Shared module change: tests all 68 models (~2-3 hours)
# - Docs/tools-only change: skips entirely (0 min)

test-e2e-selective:
  stage: tier3-e2e
  needs:
    - build-all
    - impact-analysis
    - check-family-coverage
    - check-cyclomatic-complexity
    - test-tools
    - coverage-python
    - coverage-cpp
    - test-graph-ops
  script:
    - |
      MODELS=$(python3 -c "
      import json, sys
      d = json.load(open('impact.json'))
      models = d.get('e2e_models', [])
      if not models:
          sys.exit(0)
      print(' or '.join(f'test_e2e[{m}]' for m in models))
      ")
      if [ -z "$MODELS" ]; then
        echo "No E2E models affected by this change -- skipping E2E tests"
        exit 0
      fi
      MODEL_COUNT=$(python3 -c "import json; print(len(json.load(open('impact.json'))['e2e_models']))")
      echo "Running selective E2E: $MODEL_COUNT models"
      echo "Filter: $MODELS"
    - |
      # Extract selective model list from impact analysis
      python3 -c "
      import json
      d = json.load(open('impact.json'))
      models = d.get('e2e_models', [])
      with open('e2e_models.txt', 'w') as f:
          for m in models:
              f.write(m + '\n')
      print(f'Selective E2E: {len(models)} models')
      for m in models[:10]:
          print(f'  {m}')
      if len(models) > 10:
          print(f'  ... and {len(models) - 10} more')
      "
      MODEL_COUNT=$(wc -l < e2e_models.txt)
      if [ "$MODEL_COUNT" -eq 0 ]; then
        echo "No E2E models affected -- skipping"
        exit 0
      fi
      ./scripts/run_e2e_parallel.sh \
        --engine-dir $ENGINE_DIR \
        --result-dir e2e_artifacts \
        --trtf-binary ./build/trtf \
        --workers-per-gpu 4 \
        --models-file e2e_models.txt \
        --rebuild-engines
  after_script:
    - |
      if [ -d e2e_artifacts ]; then
        python scripts/generate_e2e_report.py \
          --artifacts-dir e2e_artifacts/artifacts \
          -o e2e_artifacts/e2e_report.html \
          --project-dir . \
          --title "E2E Report - MR !${CI_MERGE_REQUEST_IID:-manual}" \
          || true
      fi
  artifacts:
    paths:
      - e2e_artifacts/
    when: always
    expire_in: 2 days
  timeout: 4h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Nightly: Full E2E Suite (all 68 models, scheduled) ──────────────────────
# Runs every night on master via GitLab CI schedule. Force-rebuilds all
# bundles and tests all 68 models — the gold-standard regression gate.
# Configure in GitLab: Settings > CI/CD > Pipeline schedules
#   Branch: master, Cron: 0 2 * * * (2 AM daily)

test-e2e-nightly:
  stage: nightly-e2e
  needs: [build-all]
  script:
    - "echo '=== Nightly Full E2E: all 68 models ==='"
    - nvidia-smi
    - |
      ./scripts/run_e2e_parallel.sh \
        --engine-dir $ENGINE_DIR \
        --result-dir e2e_artifacts \
        --trtf-binary ./build/trtf \
        --workers-per-gpu 4 \
        --rebuild-engines
  after_script:
    - |
      if [ -d e2e_artifacts ]; then
        python scripts/generate_e2e_report.py \
          --artifacts-dir e2e_artifacts/artifacts \
          -o e2e_artifacts/e2e_report.html \
          --project-dir . \
          --title "Nightly E2E Report - $(date +%Y-%m-%d)" \
          || true
      fi
  artifacts:
    paths:
      - e2e_artifacts/
    when: always
    expire_in: 7 days
  timeout: 6h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── Nightly: Coverage Map Generation ──────────────────────────────────────────
# Generates per-test coverage mapping for selective unit test execution.
# MR pipelines fetch this artifact to skip irrelevant unit tests.

generate-coverage-map:
  stage: nightly-coverage
  needs: [build-all]
  script:
    - python -m pip install --disable-pip-version-check --quiet "coverage[toml]==7.6.10" "pytest-cov>=6.0" "gcovr==8.2"
    - python -m tools.coverage_map.generate --output coverage_map.json --python-bin python --build-dir build
    - python -m tools.coverage_map.generate --validate coverage_map.json
    - echo "Coverage map generated successfully"
    - >-
      python -c "import json; d=json.load(open('coverage_map.json')); m=d['meta'];
      print('Python tests: %s, C++ tests: %s, Source files: %d' % (m['python_tests'], m['cpp_tests'], len(d['source_to_tests'])))"
  artifacts:
    paths:
      - coverage_map.json
    expire_in: 30 days
  timeout: 90m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
