[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trtf-build"
version = "0.1.0"
description = "TRT engine builder for trtf — converts HF models to .trtfb bundles"
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.4",
    "numpy>=1.24",
    "ml_dtypes>=0.4",
    "onnx>=1.16",
    "onnxscript>=0.2",
    "transformers>=4.40",
]
# TensorRT must be installed separately for your CUDA version:
#   pip install tensorrt_cu12>=10.0   # for CUDA 12.x
#   pip install tensorrt>=10.0        # for CUDA 13.x (default)

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.2.2"]
test = ["pytest>=7.0", "torch>=2.0"]

[project.scripts]
trtf-build = "trtf_build.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
trtf_build = ["python_profiles.toml", "python_profile_requirements/*.txt"]
