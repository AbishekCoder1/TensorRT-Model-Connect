name: TensorRT-Model-Connect CI Report Publisher

on:
  workflow_run:
    workflows:
      - TensorRT-Model-Connect Premerge CI
      - TensorRT-Model-Connect Nightly CI
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trtmc-ci-reports
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CI report
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    environment:
      name: ci-reports
      url: ${{ steps.publish.outputs.report_url }}
    env:
      REPORTS_REPOSITORY: ${{ vars.TRTMC_REPORTS_REPOSITORY }}
      REPORTS_BRANCH: ${{ vars.TRTMC_REPORTS_BRANCH || 'gh-pages' }}
      REPORTS_BASE_URL: ${{ vars.TRTMC_REPORTS_BASE_URL }}
      REPORTS_DEPLOY_KEY: ${{ secrets.TRTMC_REPORTS_DEPLOY_KEY }}
      REPORTS_DEPLOY_TOKEN: ${{ secrets.TRTMC_REPORTS_DEPLOY_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate report deployment config
        id: config
        run: |
          set -euo pipefail
          configured=true
          if [ -z "${REPORTS_REPOSITORY:-}" ]; then
            echo "::warning::Set TRTMC_REPORTS_REPOSITORY in the ci-reports environment to publish CI reports"
            configured=false
          fi
          if [ -z "${REPORTS_BRANCH:-}" ]; then
            echo "::warning::Set TRTMC_REPORTS_BRANCH in the ci-reports environment, or leave it unset to use gh-pages"
            configured=false
          fi
          if [ -z "${REPORTS_BASE_URL:-}" ]; then
            echo "::warning::Set TRTMC_REPORTS_BASE_URL in the ci-reports environment to publish CI reports"
            configured=false
          fi
          if [ -z "${REPORTS_DEPLOY_KEY:-}" ] && [ -z "${REPORTS_DEPLOY_TOKEN:-}" ]; then
            echo "::warning::Set TRTMC_REPORTS_DEPLOY_KEY or TRTMC_REPORTS_DEPLOY_TOKEN in the ci-reports environment to publish CI reports"
            configured=false
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Configure report deployment credentials
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "${REPORTS_DEPLOY_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$REPORTS_DEPLOY_KEY" > ~/.ssh/trtmc_ci_reports
            chmod 600 ~/.ssh/trtmc_ci_reports
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            echo "REPORTS_REMOTE_URL=git@github.com:${REPORTS_REPOSITORY}.git" >> "$GITHUB_ENV"
            echo "REPORTS_AUTH_MODE=ssh" >> "$GITHUB_ENV"
            echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/trtmc_ci_reports -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "REPORTS_REMOTE_URL=https://github.com/${REPORTS_REPOSITORY}.git" >> "$GITHUB_ENV"
            echo "REPORTS_AUTH_MODE=token" >> "$GITHUB_ENV"
          fi

      - name: Resolve source run
        if: ${{ steps.config.outputs.configured == 'true' }}
        id: context
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8").read())
          workflow_run = event.get("workflow_run") or {}
          if not workflow_run:
              print("prune_only=true")
              print("kind=")
              print("artifact_name=")
              print("run_id=")
              print("run_number=")
              print("run_url=")
              print("workflow_name=")
              print("event_name=")
              print("conclusion=")
              print("head_sha=")
              print("head_branch=")
              print("pr_number=")
              print("created_at=")
              raise SystemExit(0)

          name = workflow_run.get("name", "")
          run_id = str(workflow_run.get("id", ""))
          if name == "TensorRT-Model-Connect Nightly CI":
              kind = "nightly"
              artifact = f"trtmc-nightly-{run_id}"
          elif name == "TensorRT-Model-Connect Premerge CI":
              kind = "premerge"
              artifact = f"trtmc-ci-{run_id}"
          else:
              raise SystemExit(f"Unexpected workflow_run source: {name}")

          pull_requests = workflow_run.get("pull_requests") or []
          pr_number = pull_requests[0].get("number", "") if pull_requests else ""
          print("prune_only=false")
          print(f"kind={kind}")
          print(f"artifact_name={artifact}")
          print(f"run_id={run_id}")
          print(f"run_number={workflow_run.get('run_number', '')}")
          print(f"run_url={workflow_run.get('html_url', '')}")
          print(f"workflow_name={name}")
          print(f"event_name={workflow_run.get('event', '')}")
          print(f"conclusion={workflow_run.get('conclusion', '')}")
          print(f"head_sha={workflow_run.get('head_sha', '')}")
          print(f"head_branch={workflow_run.get('head_branch', '')}")
          print(f"pr_number={pr_number}")
          print(f"created_at={workflow_run.get('updated_at', '')}")
          PY

      - name: Download CI artifact
        if: ${{ steps.config.outputs.configured == 'true' && steps.context.outputs.prune_only == 'false' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          run-id: ${{ steps.context.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ci-artifact

      - name: Prepare HTML report
        if: ${{ steps.config.outputs.configured == 'true' }}
        id: prepare
        run: |
          set -euo pipefail
          mkdir -p prepared-report
          report_path=""
          if [ "${{ steps.context.outputs.prune_only }}" = "false" ]; then
            if [ -d ci-artifact/e2e_artifacts/artifacts ]; then
              report_path="prepared-report/e2e_report.html"
              python3 scripts/generate_e2e_report.py \
                --artifacts-dir ci-artifact/e2e_artifacts/artifacts \
                -o "$report_path" \
                --project-dir . \
                --title "GitHub Actions E2E Report - ${{ steps.context.outputs.run_id }}"
            elif [ -f ci-artifact/e2e_artifacts/e2e_report.html ]; then
              report_path="prepared-report/e2e_report.html"
              cp ci-artifact/e2e_artifacts/e2e_report.html "$report_path"
            else
              echo "No E2E report artifact found for source run ${{ steps.context.outputs.run_id }}."
            fi
          fi
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"

      - name: Check out report site
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          git_auth=()
          if [ "${REPORTS_AUTH_MODE}" = "token" ]; then
            git_auth=(-c "http.extraheader=AUTHORIZATION: bearer ${REPORTS_DEPLOY_TOKEN}")
          fi
          mkdir -p report-site
          cd report-site
          git init
          git remote add origin "$REPORTS_REMOTE_URL"
          if git "${git_auth[@]}" fetch --depth=1 origin "${REPORTS_BRANCH}"; then
            git checkout -B "${REPORTS_BRANCH}" FETCH_HEAD
          else
            git checkout --orphan "${REPORTS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Publish or prune report indexes
        if: ${{ steps.config.outputs.configured == 'true' }}
        id: publish
        run: |
          set -euo pipefail
          args=(
            --site-root report-site
            --base-url "$REPORTS_BASE_URL"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "${{ steps.context.outputs.prune_only }}" = "true" ]; then
            args+=(--prune-only)
          else
            args+=(
              --report-html "${{ steps.prepare.outputs.report_path }}"
              --kind "${{ steps.context.outputs.kind }}"
              --run-id "${{ steps.context.outputs.run_id }}"
              --run-number "${{ steps.context.outputs.run_number }}"
              --run-url "${{ steps.context.outputs.run_url }}"
              --workflow-name "${{ steps.context.outputs.workflow_name }}"
              --event-name "${{ steps.context.outputs.event_name }}"
              --conclusion "${{ steps.context.outputs.conclusion }}"
              --head-sha "${{ steps.context.outputs.head_sha }}"
              --head-branch "${{ steps.context.outputs.head_branch }}"
              --pr-number "${{ steps.context.outputs.pr_number }}"
              --created-at "${{ steps.context.outputs.created_at }}"
            )
          fi
          python3 scripts/publish_ci_report.py "${args[@]}"

      - name: Commit report site
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          cd report-site
          git add -A
          if git diff --cached --quiet; then
            echo "No report site changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish CI report ${{ steps.context.outputs.run_id || 'prune' }}"
          git_auth=()
          if [ "${REPORTS_AUTH_MODE}" = "token" ]; then
            git_auth=(-c "http.extraheader=AUTHORIZATION: bearer ${REPORTS_DEPLOY_TOKEN}")
          fi
          git "${git_auth[@]}" push origin "HEAD:${REPORTS_BRANCH}"
