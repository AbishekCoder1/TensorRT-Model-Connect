name: TensorRT-Model-Connect CI

on:
  push:
    branches:
      - master
      - ai-staging
  pull_request:
    branches:
      - master
      - ai-staging
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full nightly E2E suite instead of only selective MR E2E.
        required: false
        type: boolean
        default: false
      coverage_map:
        description: Generate the test coverage map artifact.
        required: false
        type: boolean
        default: true
      rebuild_engines:
        description: Rebuild engine bundles during E2E.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: trtmc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENGINE_DIR: ${{ vars.TRTMC_ENGINE_DIR || '/workspace/users/yifeif/tensorrt-model-connect/engines' }}
  TRTMC_CI_IMAGE: ${{ vars.TRTMC_CI_IMAGE || 'trtf-dev-gb300:latest' }}
  TRTMC_CONTAINER_OPTIONS: ${{ vars.TRTMC_CONTAINER_OPTIONS || '--gpus all --ipc=host --ulimit memlock=-1 --ulimit stack=67108864' }}
  PYTHONHASHSEED: "0"
  PYTHON_COVERAGE_MIN_LINE: "38"
  PYTHON_COVERAGE_MIN_BRANCH: "25"
  CPP_COVERAGE_MIN_LINE: "36"
  CPP_COVERAGE_MIN_FUNCTION: "46"
  CPP_COVERAGE_MIN_BRANCH: "21"
  FULL_E2E: ${{ github.event_name == 'schedule' || inputs.full_e2e == true || inputs.full_e2e == 'true' }}
  RUN_COVERAGE_MAP: ${{ github.event_name == 'schedule' || inputs.coverage_map == true || inputs.coverage_map == 'true' }}
  REBUILD_ENGINES: ${{ github.event_name == 'schedule' || inputs.rebuild_engines == true || inputs.rebuild_engines == 'true' }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  full-ci:
    name: Full CI
    runs-on: ${{ fromJSON(vars.TRTMC_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 720

    defaults:
      run:
        shell: bash

    steps:
      - name: Pre-clean self-hosted workspace
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker image inspect "$TRTMC_CI_IMAGE" >/dev/null || {
              echo "::error::Docker image '$TRTMC_CI_IMAGE' is not present on the self-hosted runner. Set repository variable TRTMC_CI_IMAGE if the runner uses a different local image tag."
              exit 1
            }
            docker run --rm \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              -w "$GITHUB_WORKSPACE" \
              "$TRTMC_CI_IMAGE" \
              bash -lc '
                set -euo pipefail
                cleanup_workspace() {
                  find . -mindepth 1 -maxdepth 1 ! -name .git -exec chmod -R u+rwX {} + 2>/dev/null || true
                  find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                }
                cleanup_workspace || {
                  echo "::warning::Initial workspace cleanup failed; retrying after canceled-run processes settle"
                  sleep 10
                  cleanup_workspace
                }
              '
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
          lfs: false

      - name: Resolve comparison base
        id: base
        run: |
          set -euo pipefail
          base=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            schedule|workflow_dispatch)
              base="origin/${GITHUB_REF_NAME:-master}"
              ;;
          esac

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse --verify "origin/${GITHUB_REF_NAME:-master}" >/dev/null 2>&1; then
              base="origin/${GITHUB_REF_NAME:-master}"
            else
              base="HEAD~1"
            fi
          fi

          echo "CI_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Using comparison base: $base"

      - name: Setup TensorRT-Model-Connect
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh setup

      - name: Impact analysis
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh impact

      - name: Build all
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh build

      - name: Check family coverage
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh family-coverage

      - name: Check cyclomatic complexity
        timeout-minutes: 15
        run: bash .github/scripts/run-gha-stage.sh complexity

      - name: Lint changed files
        timeout-minutes: 5
        run: bash .github/scripts/run-gha-stage.sh lint

      - name: C++ unit tests
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh cpp-unit

      - name: Python builder and tools tests
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh python-builder

      - name: C++ coverage
        timeout-minutes: 40
        run: bash .github/scripts/run-gha-stage.sh cpp-coverage

      - name: Graph-op GPU tests
        timeout-minutes: 20
        run: bash .github/scripts/run-gha-stage.sh graph-ops

      - name: Selective E2E tests
        timeout-minutes: 240
        run: bash .github/scripts/run-gha-stage.sh selective-e2e

      - name: Full E2E tests
        timeout-minutes: 360
        run: bash .github/scripts/run-gha-stage.sh full-e2e

      - name: Generate coverage map
        timeout-minutes: 90
        run: bash .github/scripts/run-gha-stage.sh coverage-map

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trtmc-ci-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            impact.json
            coverage_map.json
            coverage/
            e2e_artifacts/
