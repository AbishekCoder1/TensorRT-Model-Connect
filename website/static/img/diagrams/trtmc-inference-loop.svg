<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Text generation inference loop</title>
  <desc id="desc">Prompt text is tokenized, prefetched through the engine, then decoded one token at a time using the KV cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#101828}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#475467}
      .lane{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:800;fill:#344054}
      .label{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;fill:#101828}
      .small{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#475467}
      .card{fill:#fff;stroke:#d0d7e2;stroke-width:1.5}
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="518" rx="18" fill="#fbfcfe" stroke="#d0d7e2"/>
  <text x="48" y="58" class="title">generate() loop</text>
  <text x="48" y="88" class="subtitle">Prefill once, then decode one token at a time with cached attention state.</text>

  <rect x="48" y="124" width="1024" height="122" rx="18" fill="#eef6ff" stroke="#93c5fd"/>
  <text x="74" y="156" class="lane">PREFILL: read the prompt once</text>
  <g>
    <rect x="86" y="178" width="150" height="46" rx="12" class="card"/>
    <text x="161" y="207" text-anchor="middle" class="label">Prompt</text>
    <rect x="292" y="178" width="150" height="46" rx="12" class="card"/>
    <text x="367" y="207" text-anchor="middle" class="label">Tokenizer</text>
    <rect x="498" y="178" width="150" height="46" rx="12" class="card"/>
    <text x="573" y="207" text-anchor="middle" class="label">Prefill</text>
    <rect x="704" y="178" width="150" height="46" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="779" y="207" text-anchor="middle" class="label">KV cache</text>
    <rect x="910" y="178" width="110" height="46" rx="12" class="card"/>
    <text x="965" y="207" text-anchor="middle" class="label">State</text>
  </g>

  <rect x="48" y="286" width="1024" height="156" rx="18" fill="#f8fafc" stroke="#d0d7e2"/>
  <text x="74" y="318" class="lane">DECODE LOOP: repeat until EOS or max_new_tokens</text>
  <g>
    <rect x="86" y="344" width="150" height="54" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="161" y="367" text-anchor="middle" class="label">KV cache</text>
    <text x="161" y="388" text-anchor="middle" class="small">previous context</text>
    <rect x="292" y="344" width="150" height="54" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="367" y="367" text-anchor="middle" class="label">Decode</text>
    <text x="367" y="388" text-anchor="middle" class="small">one step</text>
    <rect x="498" y="344" width="150" height="54" rx="12" class="card"/>
    <text x="573" y="367" text-anchor="middle" class="label">Logits</text>
    <text x="573" y="388" text-anchor="middle" class="small">token scores</text>
    <rect x="704" y="344" width="150" height="54" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="779" y="367" text-anchor="middle" class="label">Sampler</text>
    <text x="779" y="388" text-anchor="middle" class="small">choose next</text>
    <rect x="910" y="344" width="110" height="54" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="965" y="367" text-anchor="middle" class="label">Token</text>
    <text x="965" y="388" text-anchor="middle" class="small">append</text>
  </g>

  <line x1="236" y1="201" x2="292" y2="201" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="442" y1="201" x2="498" y2="201" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="648" y1="201" x2="704" y2="201" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="854" y1="201" x2="910" y2="201" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M965 224V260H161V344" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="236" y1="371" x2="292" y2="371" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="442" y1="371" x2="498" y2="371" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="648" y1="371" x2="704" y2="371" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="854" y1="371" x2="910" y2="371" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M965 344V318H161V344" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="M965 398V460H100" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="100" y="446" width="168" height="42" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="184" y="473" text-anchor="middle" class="label">TextResult</text>
</svg>
