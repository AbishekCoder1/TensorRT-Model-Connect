<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">TensorRT-Model-Connect code building blocks</title>
  <desc id="desc">Three ownership zones: Python builder, bundle boundary, and C++ runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#101828}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#475467}
      .header{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;fill:#101828}
      .label{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;fill:#101828}
      .small{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#475467}
      .path{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:700;fill:#344054}
      .pill{fill:#fff;stroke:#d0d7e2;stroke-width:1.3}
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="558" rx="18" fill="#fbfcfe" stroke="#d0d7e2"/>
  <text x="48" y="58" class="title">Code ownership</text>
  <text x="48" y="88" class="subtitle">Choose the boundary first, then the narrow source unit that owns the behavior.</text>

  <g>
    <rect x="48" y="126" width="308" height="334" rx="18" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="82" y="168" class="header">Python builder</text>
    <text x="82" y="196" class="small">Converts checkpoints into engines.</text>
    <rect x="82" y="232" width="240" height="40" rx="12" class="pill"/>
    <text x="202" y="258" text-anchor="middle" class="label">ModelConfig</text>
    <rect x="82" y="286" width="240" height="40" rx="12" class="pill"/>
    <text x="202" y="312" text-anchor="middle" class="label">FamilyPlugin</text>
    <rect x="82" y="340" width="240" height="40" rx="12" class="pill"/>
    <text x="202" y="366" text-anchor="middle" class="label">graph_ops + builders</text>
    <rect x="82" y="394" width="240" height="40" rx="12" fill="#dbeafe"/>
    <text x="202" y="420" text-anchor="middle" class="path">tensorrt_model_connect/families</text>
  </g>

  <g>
    <rect x="406" y="126" width="308" height="334" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="440" y="168" class="header">Bundle boundary</text>
    <text x="440" y="196" class="small">Holds deployable metadata and assets.</text>
    <rect x="440" y="232" width="240" height="40" rx="12" class="pill"/>
    <text x="560" y="258" text-anchor="middle" class="label">.trtfb container</text>
    <rect x="440" y="286" width="240" height="40" rx="12" class="pill"/>
    <text x="560" y="312" text-anchor="middle" class="label">config + manifest</text>
    <rect x="440" y="340" width="240" height="40" rx="12" class="pill"/>
    <text x="560" y="366" text-anchor="middle" class="label">engines + assets</text>
    <rect x="440" y="394" width="240" height="40" rx="12" fill="#fef3c7"/>
    <text x="560" y="420" text-anchor="middle" class="path">runtime_strategy key</text>
  </g>

  <g>
    <rect x="764" y="126" width="308" height="334" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="798" y="168" class="header">C++ runtime</text>
    <text x="798" y="196" class="small">Loads bundles and runs requests.</text>
    <rect x="798" y="232" width="240" height="40" rx="12" class="pill"/>
    <text x="918" y="258" text-anchor="middle" class="label">PipelineFactory</text>
    <rect x="798" y="286" width="240" height="40" rx="12" class="pill"/>
    <text x="918" y="312" text-anchor="middle" class="label">PipelineRegistry</text>
    <rect x="798" y="340" width="240" height="40" rx="12" class="pill"/>
    <text x="918" y="366" text-anchor="middle" class="label">IPipelinePlugin</text>
    <rect x="798" y="394" width="240" height="40" rx="12" fill="#dcfce7"/>
    <text x="918" y="420" text-anchor="middle" class="path">src/runtime/plugins</text>
  </g>

  <line x1="356" y1="293" x2="406" y2="293" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="714" y1="293" x2="764" y2="293" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="170" y="488" width="780" height="42" rx="12" fill="#f8fafc" stroke="#d0d7e2"/>
  <text x="560" y="515" text-anchor="middle" class="small">Rule of thumb: add model knowledge in the builder, artifact evidence in the bundle, and request behavior in runtime plugins.</text>
</svg>
