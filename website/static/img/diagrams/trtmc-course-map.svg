<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">TensorRT-Model-Connect learning path</title>
  <desc id="desc">A six module course path from inference vocabulary to extension and validation work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#101828}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#475467}
      .num{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;fill:#fff}
      .label{font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:800;fill:#101828}
      .small{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#475467}
      .tag{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:700;fill:#344054}
      .card{fill:#fff;stroke:#d0d7e2;stroke-width:1.5}
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="468" rx="18" fill="#fbfcfe" stroke="#d0d7e2"/>
  <text x="48" y="58" class="title">Course path</text>
  <text x="48" y="88" class="subtitle">Concept, reading target, proof point, then the next module.</text>

  <g>
    <rect x="48" y="126" width="312" height="110" rx="14" class="card"/>
    <circle cx="84" cy="162" r="19" fill="#0284c7"/>
    <text x="84" y="168" text-anchor="middle" class="num">1</text>
    <text x="118" y="158" class="label">Vocabulary</text>
    <text x="118" y="184" class="small">model, tensor, token, logits</text>
    <rect x="118" y="202" width="116" height="24" rx="12" fill="#e0f2fe"/>
    <text x="176" y="219" text-anchor="middle" class="tag">mental model</text>
  </g>
  <g>
    <rect x="404" y="126" width="312" height="110" rx="14" class="card"/>
    <circle cx="440" cy="162" r="19" fill="#16a34a"/>
    <text x="440" y="168" text-anchor="middle" class="num">2</text>
    <text x="474" y="158" class="label">Run one model</text>
    <text x="474" y="184" class="small">build, inspect, generate</text>
    <rect x="474" y="202" width="112" height="24" rx="12" fill="#dcfce7"/>
    <text x="530" y="219" text-anchor="middle" class="tag">first bundle</text>
  </g>
  <g>
    <rect x="760" y="126" width="312" height="110" rx="14" class="card"/>
    <circle cx="796" cy="162" r="19" fill="#d97706"/>
    <text x="796" y="168" text-anchor="middle" class="num">3</text>
    <text x="830" y="158" class="label">Inspect the artifact</text>
    <text x="830" y="184" class="small">engine plans, config, assets</text>
    <rect x="830" y="202" width="126" height="24" rx="12" fill="#fef3c7"/>
    <text x="893" y="219" text-anchor="middle" class="tag">bundle anatomy</text>
  </g>

  <g>
    <rect x="48" y="306" width="312" height="110" rx="14" class="card"/>
    <circle cx="84" cy="342" r="19" fill="#7c3aed"/>
    <text x="84" y="348" text-anchor="middle" class="num">4</text>
    <text x="118" y="338" class="label">Trace architecture</text>
    <text x="118" y="364" class="small">builder to bundle to runtime</text>
    <rect x="118" y="382" width="122" height="24" rx="12" fill="#ede9fe"/>
    <text x="179" y="399" text-anchor="middle" class="tag">source map</text>
  </g>
  <g>
    <rect x="404" y="306" width="312" height="110" rx="14" class="card"/>
    <circle cx="440" cy="342" r="19" fill="#0891b2"/>
    <text x="440" y="348" text-anchor="middle" class="num">5</text>
    <text x="474" y="338" class="label">Compare modalities</text>
    <text x="474" y="364" class="small">text, audio, image, time-series</text>
    <rect x="474" y="382" width="128" height="24" rx="12" fill="#cffafe"/>
    <text x="538" y="399" text-anchor="middle" class="tag">pipeline shape</text>
  </g>
  <g>
    <rect x="760" y="306" width="312" height="110" rx="14" class="card"/>
    <circle cx="796" cy="342" r="19" fill="#dc2626"/>
    <text x="796" y="348" text-anchor="middle" class="num">6</text>
    <text x="830" y="338" class="label">Extend safely</text>
    <text x="830" y="364" class="small">owning unit, tests, evidence</text>
    <rect x="830" y="382" width="120" height="24" rx="12" fill="#fee2e2"/>
    <text x="890" y="399" text-anchor="middle" class="tag">proof point</text>
  </g>

  <line x1="360" y1="181" x2="404" y2="181" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="181" x2="760" y2="181" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M916 236V270H204V306" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="361" x2="404" y2="361" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="361" x2="760" y2="361" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
