<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #243b53; }
      .label { font: 600 15px Arial, sans-serif; fill: #102a43; }
      .small { font: 500 13px Arial, sans-serif; fill: #334e68; }
      .box { stroke: #486581; stroke-width: 2; rx: 12; ry: 12; }
      .core { fill: #d9e2ec; }
      .api { fill: #c7d2fe; }
      .model { fill: #dcfce7; }
      .runtime { fill: #e0fbfc; }
      .ext { fill: #fde68a; }
      .out { fill: #fee2e2; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; ry: 14; }
      .arrow { stroke: #102a43; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 11,4 0,8" fill="#102a43"/>
    </marker>
  </defs>

  <text x="36" y="42" class="title">trt-transformers-cpp Architecture Overview</text>
  <text x="36" y="70" class="subtitle">Decoupled pipeline orchestration, model resolution, runtime assembly, and backend execution.</text>

  <rect x="28" y="96" width="1344" height="736" class="lane"/>

  <rect x="70" y="145" width="250" height="90" class="box api"/>
  <text x="90" y="180" class="label">User/Application</text>
  <text x="90" y="204" class="small">CreateTextGeneration(model_id)</text>

  <rect x="370" y="130" width="360" height="130" class="box core"/>
  <text x="390" y="164" class="label">Pipeline::CreateTextGeneration</text>
  <text x="390" y="188" class="small">src/pipeline/pipeline.cpp</text>
  <text x="390" y="212" class="small">orchestration only (no model/backend branching)</text>
  <text x="390" y="236" class="small">calls resolver + runtime factory</text>

  <rect x="780" y="120" width="300" height="130" class="box model"/>
  <text x="800" y="154" class="label">ResolveTextGenerationModel</text>
  <text x="800" y="178" class="small">src/model/model_resolver.cpp</text>
  <text x="800" y="202" class="small">model_id -&gt; ResolvedModelSpec</text>
  <text x="800" y="226" class="small">kDecoderDefinition / kHuggingFaceLocal / kCustom</text>

  <rect x="1130" y="120" width="210" height="130" class="box ext"/>
  <text x="1150" y="154" class="label">Extension Hook</text>
  <text x="1150" y="178" class="small">RegisterTextGeneration</text>
  <text x="1150" y="198" class="small">ModelResolver(...)</text>
  <text x="1150" y="222" class="small">optional custom resolver</text>

  <rect x="780" y="300" width="300" height="130" class="box runtime"/>
  <text x="800" y="334" class="label">BuildRuntimeForTextGeneration</text>
  <text x="800" y="358" class="small">src/runtime/runtime_factory.cpp</text>
  <text x="800" y="382" class="small">ResolvedModelSpec + BackendSelection</text>
  <text x="800" y="406" class="small">-&gt; RuntimeAssembly(tokenizer + backend)</text>

  <rect x="1130" y="300" width="210" height="130" class="box ext"/>
  <text x="1150" y="334" class="label">Extension Hook</text>
  <text x="1150" y="358" class="small">RegisterTextGeneration</text>
  <text x="1150" y="378" class="small">RuntimeAssembler(...)</text>
  <text x="1150" y="402" class="small">optional custom backend</text>

  <rect x="70" y="320" width="660" height="150" class="box api"/>
  <text x="90" y="354" class="label">Pipeline instance (operator())</text>
  <text x="90" y="378" class="small">If backend supports direct text generation: backend.generate_text(prompt)</text>
  <text x="90" y="402" class="small">Else: tokenizer.encode(prompt) -&gt; backend.generate(ids) -&gt; tokenizer.decode(ids)</text>
  <text x="90" y="426" class="small">Returns pipeline-style result list [{ 'generated_text': ... }]</text>

  <rect x="70" y="520" width="280" height="130" class="box runtime"/>
  <text x="90" y="554" class="label">Tokenizer</text>
  <text x="90" y="578" class="small">ITokenizer implementation</text>
  <text x="90" y="602" class="small">typically vocab tokenizer</text>
  <text x="90" y="626" class="small">assembled by runtime factory</text>

  <rect x="390" y="520" width="320" height="130" class="box runtime"/>
  <text x="410" y="554" class="label">Backend</text>
  <text x="410" y="578" class="small">IGenerationBackend contract</text>
  <text x="410" y="602" class="small">trt / cpu-reference / hf-transformers</text>
  <text x="410" y="626" class="small">or custom backend via extension hook</text>

  <rect x="780" y="520" width="300" height="130" class="box model"/>
  <text x="800" y="554" class="label">Model Assets</text>
  <text x="800" y="578" class="small">built-in tiny-cake-v1</text>
  <text x="800" y="602" class="small">local decoder model dir (config/vocab/transitions/weights)</text>
  <text x="800" y="626" class="small">HF local dir (config.json + model.safetensors)</text>

  <rect x="1130" y="520" width="210" height="130" class="box out"/>
  <text x="1150" y="554" class="label">Output</text>
  <text x="1150" y="578" class="small">[{'generated_text': ...}]</text>
  <text x="1150" y="602" class="small">same shape as python pipeline</text>

  <path d="M320 190 L370 190" class="arrow"/>
  <path d="M730 190 L780 190" class="arrow"/>
  <path d="M1130 190 L1080 190" class="arrow dashed"/>
  <path d="M930 250 L930 300" class="arrow"/>
  <path d="M1130 365 L1080 365" class="arrow dashed"/>
  <path d="M780 365 L730 365" class="arrow"/>
  <path d="M400 470 L400 520" class="arrow"/>
  <path d="M210 470 L210 520" class="arrow"/>
  <path d="M930 470 L930 520" class="arrow"/>
  <path d="M710 585 L780 585" class="arrow"/>
  <path d="M1080 585 L1130 585" class="arrow"/>

  <text x="70" y="708" class="subtitle">Goal: add new model support by registering resolver + assembler, without changing pipeline entrypoint.</text>
</svg>
