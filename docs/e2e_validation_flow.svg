<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #334e68; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 14px Arial, sans-serif; fill: #102a43; }
      .small { font: 500 12px Arial, sans-serif; fill: #334e68; }
      .step { fill: #f8fafc; stroke: #486581; stroke-width: 2; rx: 12; ry: 12; }
      .host { fill: #e0f2fe; }
      .container { fill: #ecfccb; }
      .result { fill: #fee2e2; }
      .lane { stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .arrow { stroke: #0f172a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="32" y="44" class="title">E2E Validation Flow (Container-Centric)</text>
  <text x="32" y="72" class="subtitle">Host builds and launches GPU container; container runs configure/build/test/run/parity checks.</text>

  <rect x="30" y="100" width="630" height="790" class="lane" fill="#f0f9ff"/>
  <rect x="740" y="100" width="630" height="790" class="lane" fill="#f7fee7"/>
  <text x="54" y="134" class="lane-title">Host Shell</text>
  <text x="764" y="134" class="lane-title">GPU Container (`trtf-dev`)</text>

  <rect x="60" y="170" width="560" height="86" class="step host"/>
  <text x="80" y="202" class="label">1) Prereq check</text>
  <text x="80" y="224" class="small">Docker + NVIDIA Container Toolkit installed (`docker run --gpus all ...` works)</text>

  <rect x="60" y="285" width="560" height="94" class="step host"/>
  <text x="80" y="318" class="label">2) Build image</text>
  <text x="80" y="340" class="small">`./scripts/docker_build.sh`</text>
  <text x="80" y="360" class="small">(equivalent: `docker build -t trtf-dev -f Dockerfile .`)</text>

  <rect x="60" y="410" width="560" height="120" class="step host"/>
  <text x="80" y="442" class="label">3) Launch interactive GPU container</text>
  <text x="80" y="464" class="small">`./scripts/docker_run.sh`</text>
  <text x="80" y="486" class="small">or explicit: `docker run --rm -it --gpus all ... trtf-dev bash`</text>
  <text x="80" y="508" class="small">mounts repo + TRT path into `/opt/trt`</text>

  <rect x="60" y="700" width="560" height="150" class="step result"/>
  <text x="80" y="734" class="label">8) Success criteria</text>
  <text x="80" y="756" class="small">- `ctest` passes all tests</text>
  <text x="80" y="778" class="small">- default run returns generated text</text>
  <text x="80" y="800" class="small">- `--force-trt` uses TRT or fails explicitly with TRT-unavailable error</text>
  <text x="80" y="822" class="small">- optional HF parity script reports identical output</text>

  <rect x="770" y="170" width="560" height="86" class="step container"/>
  <text x="790" y="202" class="label">4) GPU visibility check</text>
  <text x="790" y="224" class="small">`nvidia-smi -L`</text>

  <rect x="770" y="285" width="560" height="112" class="step container"/>
  <text x="790" y="318" class="label">5) Configure and build</text>
  <text x="790" y="340" class="small">`cmake -S . -B build -G Ninja -DTRTF_TRT_INCLUDE_DIR=... -DTRTF_TRT_LIBRARY=...`</text>
  <text x="790" y="360" class="small">`cmake --build build -j`</text>
  <text x="790" y="380" class="small">ensures same toolchain and TRT library resolution as runtime path</text>

  <rect x="770" y="426" width="560" height="90" class="step container"/>
  <text x="790" y="458" class="label">6) Test suite</text>
  <text x="790" y="480" class="small">`ctest --test-dir build --output-on-failure`</text>

  <rect x="770" y="542" width="560" height="108" class="step container"/>
  <text x="790" y="574" class="label">7) Runtime E2E</text>
  <text x="790" y="596" class="small">`./build/trtf_text_generation`</text>
  <text x="790" y="616" class="small">`./build/trtf_text_generation --force-trt`</text>
  <text x="790" y="636" class="small">verifies fallback path and force-TRT path behavior</text>

  <rect x="770" y="680" width="560" height="118" class="step container"/>
  <text x="790" y="712" class="label">Optional HF parity check</text>
  <text x="790" y="734" class="small">install Python deps in venv (`torch`, `transformers`, `safetensors`, ...)</text>
  <text x="790" y="754" class="small">run `python scripts/compare_hf_pipeline_vs_transformers.py ...`</text>
  <text x="790" y="776" class="small">confirms pipeline output matches direct transformers output</text>

  <path d="M340 256 L340 285" class="arrow"/>
  <path d="M340 379 L340 410" class="arrow"/>
  <path d="M620 470 L770 470" class="arrow"/>
  <path d="M1050 256 L1050 285" class="arrow"/>
  <path d="M1050 397 L1050 426" class="arrow"/>
  <path d="M1050 516 L1050 542" class="arrow"/>
  <path d="M1050 650 L1050 680" class="arrow dashed"/>
  <path d="M770 755 L620 775" class="arrow dashed"/>

  <text x="36" y="900" class="subtitle">Use this as the canonical E2E checklist in CI or manual validation sessions.</text>
</svg>
